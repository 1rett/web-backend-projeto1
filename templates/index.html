<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arquibancada | Camisas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="container">
    <a href="/" class="brand">Arquibancada</a>
    <nav><a href="/login">Entrar</a></nav>
  </header>

  <main class="container">
    <h1>Camisas do Brasileirão</h1>

    <section aria-labelledby="buscar-usuario-titulo">
      <h2 id="buscar-usuario-titulo">Buscar usuário por ID</h2>
      <form id="buscaUsuario" class="linha">
        <label for="usuarioIdBusca">ID do usuário</label>
        <input id="usuarioIdBusca" type="number" min="1" step="1" required>
        <button type="submit">Buscar usuário</button>
      </form>
    </section>

    <section aria-labelledby="buscar-produtos-titulo">
      <h2 id="buscar-produtos-titulo">Buscar camisas</h2>
      <form id="buscaProdutos" class="filtros">
        <div>
          <label for="busca">Nome ou descrição</label>
          <input id="busca" type="search" placeholder="Ex.: Palmeiras">
        </div>
        <div>
          <label for="estado">Estado</label>
          <select id="estado">
            <option value="">Todos os estados</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="BA">Bahia</option>
            <option value="PR">Paraná</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="PA">Pará</option>
            <option value="SC">Santa Catarina</option>
          </select>
        </div>
        <button type="submit">Pesquisar</button>
      </form>
      <div id="grid" aria-live="polite"></div>
      <nav id="paginacao" class="paginacao" aria-label="Paginação"></nav>
    </section>
  </main>

  <script src="{{ url_for('static', filename='comum.js') }}"></script>
  <script src="{{ url_for('static', filename='loja.js') }}"></script>
</body>
</html>
